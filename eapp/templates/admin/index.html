{% extends 'admin/master.html' %}

{% block body %}
<h1 class = "text-center text-success mt-2"> ĐĂNG NHẬP QUẢN TRỊ </h1>


{% if current_user.is_authenticated %}
<div class = "alert alert-info mt-2">
  Chào <span class = "text-success">{{ current_user.username }}</span>
</div>
{% else %}

{% if err_msg %}
<div class = "alert alert-danger">
  {{ err_msg }}
</div>
{% endif %}
<form method = "post" action="/login">
  <div class="form-group">
    <label for="email">Tên Đăng Nhập:</label>
    <input type="text" class="form-control" placeholder="Tên Đăng Nhập" id="username" name = "username">
  </div>
  <div class="form-group">
    <label for="pwd">Password:</label>
    <input type="password" class="form-control" placeholder="Enter password" id="pwd" name = "password">
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endif %}
{% endblock %}
