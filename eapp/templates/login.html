{% extends 'layout/base.html' %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<h1 class="text-center text-success mt-2">ĐĂNG NHẬP NGƯỜI DÙNG</h1>
<form method = "post" action = "/login?from=client">
    <div class="form-floating mb-3 mt-3">
  <input type="text" class="form-control" id="email" placeholder="Tên Đăng Nhập" name="username">
  <label for="email">Tên đăng nhập</label>
</div>
    <div class="form-floating mt-3 mb-3">
  <input type="text" class="form-control" id="password" placeholder="Mật Khẩu" name="password">
  <label for="password">Mật khẩu</label>
</div>
    <div class = "form-floating mb-3 mt-3">
        <button class = "btn btn-success" type = "submit">Đăng nhập</button>
    </div>
</form>
{% endblock %}
